name: Build APK

# Builds the Android app on every push. Pushing a tag like v1.0.0 also
# publishes a GitHub Release with nightfall.apk attached for anyone to download.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk nightfall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-apk
          path: nightfall.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nightfall.apk
          generate_release_notes: true
